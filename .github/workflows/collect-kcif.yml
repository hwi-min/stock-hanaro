name: Collect KCIF

on:
  schedule:
    # UTC: 21:00, 22:00, 22:30, 23:00, 23:30 = KST: 06:00, 07:00, 07:30, 08:00, 08:30
    - cron: "0 21 * * 0-4"
    - cron: "0 22 * * 0-4"
    - cron: "30 22 * * 0-4"
    - cron: "0 23 * * 0-4"
    - cron: "30 23 * * 0-4"
  workflow_dispatch:
    inputs:
      business_date:
        description: "KST business date (YYYY-MM-DD); blank uses today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: collect-kcif
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve KST business date and slot
        id: context
        env:
          INPUT_BUSINESS_DATE: ${{ inputs.business_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$INPUT_BUSINESS_DATE" ]]; then
            business_date="$INPUT_BUSINESS_DATE"
          else
            business_date="$(TZ=Asia/Seoul date +%F)"
            weekday="$(TZ=Asia/Seoul date +%u)"
            if [[ "$weekday" == "6" ]]; then business_date="$(TZ=Asia/Seoul date -d 'yesterday' +%F)"; fi
            if [[ "$weekday" == "7" ]]; then business_date="$(TZ=Asia/Seoul date -d '2 days ago' +%F)"; fi
          fi
          slot="${SCHEDULE:-manual-${GITHUB_RUN_ID}}"
          slot="${slot// /-}"
          echo "business_date=${business_date}" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=kcif-${business_date}-${slot}" >> "$GITHUB_OUTPUT"

      - name: Invoke KCIF job
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          JOB_NAME: collect-kcif
          BUSINESS_DATE: ${{ steps.context.outputs.business_date }}
          IDEMPOTENCY_KEY: ${{ steps.context.outputs.idempotency_key }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/invoke_job.py

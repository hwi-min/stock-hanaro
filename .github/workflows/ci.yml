name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m0-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data-source policy
        run: python scripts/validate_data_sources.py
      - name: Run policy tests
        run: python -m unittest discover -s tests -v

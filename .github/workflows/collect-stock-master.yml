name: Collect KRX Stock Master

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: "KST business date (YYYY-MM-DD); blank uses today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: collect-stock-master
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh KRX stock master
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          JOB_NAME: collect-stock-master
          BUSINESS_DATE: ${{ inputs.business_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/invoke_job.py

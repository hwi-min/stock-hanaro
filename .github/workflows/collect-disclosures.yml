name: Collect Disclosures

on:
  schedule:
    # KST weekdays 09:00-18:30
    - cron: "*/30 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      business_date:
        description: "KST business date (YYYY-MM-DD); blank uses today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: collect-disclosures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invoke disclosure job
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          JOB_NAME: collect-disclosures
          BUSINESS_DATE: ${{ inputs.business_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/invoke_job.py

name: Collect Supabase Production Data

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Collection batch"
        required: true
        default: morning
        type: choice
        options: [morning, afternoon, stock-master, sp500-master, sp500-close]
  schedule:
    - cron: "10 23 * * 0-4" # 08:10 KST, Monday-Friday
    - cron: "50 6 * * 1-5"  # 15:50 KST, Monday-Friday
    - cron: "30 20 * * 0"   # 05:30 KST, Monday stock master
    - cron: "0 0 * * 6"     # 09:00 KST, Saturday S&P 500 constituent master

permissions:
  contents: read

concurrency:
  group: supabase-production-${{ github.event.schedule || inputs.batch || 'manual' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_IS_MOCK: "false"
      KIS_REALTIME_ENABLED: "false"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Resolve batch
        id: batch
        shell: bash
        env:
          INPUT_BATCH: ${{ inputs.batch }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -n "$INPUT_BATCH" ]]; then batch="$INPUT_BATCH"
          elif [[ "$EVENT_SCHEDULE" == "10 23 * * 0-4" ]]; then batch="morning"
          elif [[ "$EVENT_SCHEDULE" == "50 6 * * 1-5" ]]; then batch="afternoon"
          elif [[ "$EVENT_SCHEDULE" == "30 20 * * 0" ]]; then batch="stock-master"
          elif [[ "$EVENT_SCHEDULE" == "0 0 * * 6" ]]; then batch="sp500-master"
          else batch="sp500-close"
          fi
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
      - name: Collect morning data
        if: steps.batch.outputs.batch == 'morning'
        shell: bash
        run: |
          failed=0
          for job in collect-us-close collect-kr-snapshot collect-news build-issues collect-calendar collect-disclosures collect-kcif collect-research summarize-content; do
            python -m app.workers.run_job "$job" --slot "gha-${GITHUB_RUN_ID}-${job}" || failed=1
          done
          exit "$failed"
      - name: Collect afternoon data
        if: steps.batch.outputs.batch == 'afternoon'
        shell: bash
        run: |
          failed=0
          for job in collect-kr-snapshot collect-news build-issues collect-disclosures collect-research; do
            python -m app.workers.run_job "$job" --slot "gha-${GITHUB_RUN_ID}-${job}" || failed=1
          done
          exit "$failed"
      - name: Refresh stock master
        if: steps.batch.outputs.batch == 'stock-master'
        run: python -m app.workers.run_job collect-stock-master --slot "gha-${GITHUB_RUN_ID}-stock-master"
      - name: Refresh S&P 500 constituent master
        if: steps.batch.outputs.batch == 'sp500-master'
        run: python -m app.workers.run_job collect-sp500-master --slot "gha-${GITHUB_RUN_ID}-sp500-master"
      - name: Collect S&P 500 closing snapshot
        if: steps.batch.outputs.batch == 'sp500-close'
        run: python -m app.workers.run_job collect-sp500-close --require-complete --slot "gha-${GITHUB_RUN_ID}-${{ github.event.schedule || 'manual' }}"

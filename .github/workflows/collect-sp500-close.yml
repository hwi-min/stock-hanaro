name: Collect S&P 500 Close

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"  # 07:00 KST, Tuesday-Saturday
    - cron: "30 22 * * 1-5" # 07:30 KST, retry missing symbols only
    - cron: "50 22 * * 1-5" # 07:50 KST, final retry of missing symbols

permissions:
  contents: read

concurrency:
  group: collect-sp500-close-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_IS_MOCK: "false"
      KIS_REALTIME_ENABLED: "false"
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Collect complete S&P 500 closing snapshot
        run: python -m app.workers.run_job collect-sp500-close --require-complete --slot "gha-${GITHUB_RUN_ID}-${{ github.event.schedule || 'manual' }}"

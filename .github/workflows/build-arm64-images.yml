name: Build ARM64 Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: arm64-production-images
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/stock-hanaro-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/stock-hanaro-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.backend }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.frontend }}:${{ env.RELEASE_SHA }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/backend-api
            BACKEND_API_BASE_URL=http://stock-hanaro-api:8000
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64
      - name: Update GitOps image references
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.image.outputs.frontend }}
        run: |
          file=deploy/overlays/production/kustomization.yaml
          sed -i -E "s|newName: ghcr.io/[^/]+/stock-hanaro-backend|newName: ${BACKEND_IMAGE}|" "$file"
          sed -i -E "s|newName: ghcr.io/[^/]+/stock-hanaro-frontend|newName: ${FRONTEND_IMAGE}|" "$file"
          sed -i "s|newTag: .*|newTag: ${RELEASE_SHA}|g" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet || git commit -m "chore(deploy): release ${RELEASE_SHA::7} [skip ci]"
          git push origin HEAD:main

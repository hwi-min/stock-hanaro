name: Collect Calendar

on:
  schedule:
    # KST 05:20
    - cron: "20 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-calendar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invoke calendar job
        env:
          BACKEND_API_BASE_URL: ${{ secrets.BACKEND_API_BASE_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          JOB_NAME: collect-calendar
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/invoke_job.py

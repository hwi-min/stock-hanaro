apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-hanaro
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/stock-hanaro.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: stock-hanaro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

apiVersion: v1
kind: Secret
metadata:
  name: stock-hanaro-postgres-secret
  namespace: stock-hanaro
type: Opaque
stringData:
  POSTGRES_DB: stock_hanaro
  POSTGRES_USER: stock_hanaro
  POSTGRES_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: stock-hanaro-app-secret
  namespace: stock-hanaro
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://stock_hanaro:REPLACE_ME@stock-hanaro-postgres:5432/stock_hanaro
  INTERNAL_JOB_SECRET: REPLACE_ME
  KIS_APP_KEY: REPLACE_ME
  KIS_APP_SECRET: REPLACE_ME
  DART_API_KEY: REPLACE_ME
  BOK_ECOS_API_KEY: REPLACE_ME
  SOLAR_API_KEY: ""

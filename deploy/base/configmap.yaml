apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-hanaro-config
data:
  APP_ENV: production
  CORS_ORIGINS: https://stock.example.com
  KIS_IS_MOCK: "false"
  KIS_REALTIME_ENABLED: "true"
  REALTIME_TICK_MAX_AGE_SECONDS: "120"
  BACKEND_API_BASE_URL: http://stock-hanaro-api:8000
  NEXT_PUBLIC_API_BASE_URL: /backend-api

apiVersion: batch/v1
kind: CronJob
metadata: {name: collect-calendar}
spec:
  schedule: "20 5 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr-pull-secret}]
          containers:
            - name: job
              image: stock-hanaro-backend
              command: ["python", "-m", "app.workers.run_job", "collect-calendar"]
              envFrom:
                - configMapRef: {name: stock-hanaro-config}
                - secretRef: {name: stock-hanaro-app-secret}
---

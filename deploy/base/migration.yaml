apiVersion: batch/v1
kind: Job
metadata:
  name: stock-hanaro-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: stock-hanaro-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: stock-hanaro-app-secret}

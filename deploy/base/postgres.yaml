apiVersion: v1
kind: Service
metadata:
  name: stock-hanaro-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    app: stock-hanaro-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stock-hanaro-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: stock-hanaro-postgres
  replicas: 1
  selector:
    matchLabels:
      app: stock-hanaro-postgres
  template:
    metadata:
      labels:
        app: stock-hanaro-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: stock-hanaro-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1536Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
